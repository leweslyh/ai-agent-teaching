<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" width="460" height="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <rect x="0" y="0" width="460" height="500" rx="14" fill="#FFFFFF" stroke="#B9D9FF" stroke-width="1.4"/>

  <!-- ============ 上栏：改造前，N × M 条连线（乱） ============ -->
  <rect x="18" y="18" width="424" height="228" rx="12" fill="#FDFEFF" stroke="#B9D9FF" stroke-width="1.3"/>
  <text x="34" y="41" font-size="13.5" font-weight="700" fill="#14629E">改造前：一对一硬接（N × M）</text>
  <rect x="356" y="25" width="72" height="20" rx="10" fill="#FFECEC" stroke="#FFBFC2" stroke-width="1"/>
  <text x="392" y="39" font-size="11.5" font-weight="700" fill="#A32026" text-anchor="middle">12 条</text>
  <text x="34" y="60" font-size="11.5" fill="#5D6B7C">每接一个新工具，都要单独写一套对接代码 → 3 × 4 = 12 条</text>

  <!-- 左侧 3 个 AI 应用 -->
  <rect x="28" y="98" width="78" height="26" rx="8" fill="#EDF5FF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="67" y="115" font-size="12" font-weight="700" fill="#14629E" text-anchor="middle">AI 应用 A</text>
  <rect x="28" y="140" width="78" height="26" rx="8" fill="#EDF5FF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="67" y="157" font-size="12" font-weight="700" fill="#14629E" text-anchor="middle">AI 应用 B</text>
  <rect x="28" y="182" width="78" height="26" rx="8" fill="#EDF5FF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="67" y="199" font-size="12" font-weight="700" fill="#14629E" text-anchor="middle">AI 应用 C</text>

  <!-- 右侧 4 个工具 -->
  <rect x="354" y="80" width="78" height="26" rx="8" fill="#F7FAFF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="393" y="97" font-size="12" font-weight="700" fill="#5D6B7C" text-anchor="middle">天气</text>
  <rect x="354" y="122" width="78" height="26" rx="8" fill="#F7FAFF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="393" y="139" font-size="12" font-weight="700" fill="#5D6B7C" text-anchor="middle">搜索</text>
  <rect x="354" y="164" width="78" height="26" rx="8" fill="#F7FAFF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="393" y="181" font-size="12" font-weight="700" fill="#5D6B7C" text-anchor="middle">课表</text>
  <rect x="354" y="206" width="78" height="26" rx="8" fill="#F7FAFF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="393" y="223" font-size="12" font-weight="700" fill="#5D6B7C" text-anchor="middle">提醒</text>

  <!-- 12 条交叉连线（3 × 4），端点错开制造"缠在一起"的观感 -->
  <path d="M106,104 Q230,58 354,88" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>
  <path d="M106,118 Q230,206 354,132" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>
  <path d="M106,111 Q230,238 354,180" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>
  <path d="M106,104 Q230,150 354,214" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>
  <path d="M106,146 Q230,74 354,96" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>
  <path d="M106,160 Q230,232 354,140" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>
  <path d="M106,146 Q230,112 354,172" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>
  <path d="M106,160 Q230,196 354,224" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>
  <path d="M106,188 Q230,120 354,84" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>
  <path d="M106,202 Q230,66 354,128" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>
  <path d="M106,195 Q230,244 354,184" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>
  <path d="M106,202 Q230,170 354,212" fill="none" stroke="#9AA7B8" stroke-width="0.9" opacity="0.8"/>

  <!-- ============ 下栏：改造后，N + M 条连线（整齐） ============ -->
  <rect x="18" y="254" width="424" height="160" rx="12" fill="#F7FAFF" stroke="#B9D9FF" stroke-width="1.3"/>
  <text x="34" y="277" font-size="13.5" font-weight="700" fill="#14629E">改造后：统一走同一条协议（N + M）</text>
  <rect x="356" y="261" width="72" height="20" rx="10" fill="#E8F5EC" stroke="#B8E0C6" stroke-width="1"/>
  <text x="392" y="275" font-size="11.5" font-weight="700" fill="#1F7A45" text-anchor="middle">7 条</text>
  <text x="34" y="296" font-size="11.5" fill="#5D6B7C">都按同一套接口说话 → 3 + 4 = 7 条</text>

  <!-- 左侧 3 个应用 -->
  <rect x="28" y="318" width="78" height="24" rx="8" fill="#EDF5FF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="67" y="334" font-size="12" font-weight="700" fill="#14629E" text-anchor="middle">AI 应用 A</text>
  <rect x="28" y="348" width="78" height="24" rx="8" fill="#EDF5FF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="67" y="364" font-size="12" font-weight="700" fill="#14629E" text-anchor="middle">AI 应用 B</text>
  <rect x="28" y="378" width="78" height="24" rx="8" fill="#EDF5FF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="67" y="394" font-size="12" font-weight="700" fill="#14629E" text-anchor="middle">AI 应用 C</text>

  <!-- 中间的协议方块：所有连线都经过它 -->
  <rect x="176" y="326" width="108" height="68" rx="10" fill="#1F7AE0" stroke="#14629E" stroke-width="1.4"/>
  <text x="230" y="356" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">MCP 协议</text>
  <text x="230" y="374" font-size="11" fill="#DCEBFF" text-anchor="middle">统一接口</text>

  <!-- 左侧 3 条 -->
  <path d="M106,330 L176,344" fill="none" stroke="#5FA3E8" stroke-width="1.6"/>
  <path d="M106,360 L176,358" fill="none" stroke="#5FA3E8" stroke-width="1.6"/>
  <path d="M106,390 L176,372" fill="none" stroke="#5FA3E8" stroke-width="1.6"/>

  <!-- 右侧 4 个工具 -->
  <rect x="354" y="312" width="78" height="24" rx="8" fill="#FDFEFF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="393" y="328" font-size="12" font-weight="700" fill="#5D6B7C" text-anchor="middle">天气</text>
  <rect x="354" y="336" width="78" height="24" rx="8" fill="#FDFEFF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="393" y="352" font-size="12" font-weight="700" fill="#5D6B7C" text-anchor="middle">搜索</text>
  <rect x="354" y="360" width="78" height="24" rx="8" fill="#FDFEFF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="393" y="376" font-size="12" font-weight="700" fill="#5D6B7C" text-anchor="middle">课表</text>
  <rect x="354" y="384" width="78" height="24" rx="8" fill="#FDFEFF" stroke="#B9D9FF" stroke-width="1.1"/>
  <text x="393" y="400" font-size="12" font-weight="700" fill="#5D6B7C" text-anchor="middle">提醒</text>

  <!-- 右侧 4 条 -->
  <path d="M284,358 L354,324" fill="none" stroke="#5FA3E8" stroke-width="1.6"/>
  <path d="M284,358 L354,348" fill="none" stroke="#5FA3E8" stroke-width="1.6"/>
  <path d="M284,358 L354,372" fill="none" stroke="#5FA3E8" stroke-width="1.6"/>
  <path d="M284,358 L354,396" fill="none" stroke="#5FA3E8" stroke-width="1.6"/>

  <!-- ============ 底部三行小注 ============ -->
  <path d="M18,424 L442,424" stroke="#E4E9F0" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="18" y="444" font-size="12" fill="#5D6B7C">MCP = 工具界的 USB 接口：统一形状，插上就能用</text>
  <text x="18" y="464" font-size="12" fill="#5D6B7C">五要素：Server / Client / Tools / Resources / Prompts</text>
  <text x="18" y="482" font-size="12" fill="#5D6B7C"><tspan fill="#A32026" font-weight="700">代价：</tspan>MCP 的工具定义也吃 Token——5 个服务器可达上万 Token</text>
</svg>
