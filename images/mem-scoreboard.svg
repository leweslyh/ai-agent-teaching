  <text x="328" y="68" font-size="12" font-weight="700" fill="#14629E">66.7%</text>

  <path d="M70,90 L445,90" stroke="#E4E9F0" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M70,152.5 L445,152.5" stroke="#E4E9F0" stroke-width="1" stroke-dasharray="4 4"/>
