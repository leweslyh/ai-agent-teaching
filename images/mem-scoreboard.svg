  <text x="132" y="356" font-size="11.5" fill="#5D6B7C" text-anchor="middle">L1 基础回忆</text>
  <text x="257" y="356" font-size="11.5" fill="#5D6B7C" text-anchor="middle">L2 多会话检索</text>
  <text x="382" y="356" font-size="11.5" fill="#5D6B7C" text-anchor="middle">L3 跨会话隐藏关联</text>

  <rect x="20" y="372" width="420" height="34" rx="8" fill="#FFF6F4" stroke="#E4572E" stroke-width="1.4"/>
  <text x="32" y="393" font-size="12.5" font-weight="700" fill="#C0553F">最刺眼的一格：L3 跨会话隐藏关联，纯 RAG 只有 15%</text>

  <text x="24" y="424" font-size="12.5" font-weight="700" fill="#14629E">总分最高的是结构化记忆 68.3%，但混合方案并没有自然胜出</text>
  <text x="24" y="444" font-size="12.5" fill="#C0553F">（混合只在 3 题上赢、却在 8 题上输）</text>
  <text x="24" y="464" font-size="12.5" font-weight="700" fill="#106B3D">没有万能方案：好不好，要看测的是哪种能力</text>
