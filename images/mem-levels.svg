<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" width="460" height="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <rect x="0" y="0" width="460" height="500" rx="14" fill="#FFFFFF" stroke="#B9D9FF" stroke-width="1.4"/>

  <rect x="140" y="22" width="180" height="26" rx="13" fill="#E8F5EC" stroke="#A8E5C6" stroke-width="1.2"/>
  <text x="230" y="40" font-size="12" font-weight="700" fill="#106B3D" text-anchor="middle">越往上越难 · 也越有价值</text>

  <rect x="184" y="96" width="256" height="110" rx="10" fill="#179A55" stroke="#106B3D" stroke-width="1.4"/>
  <rect x="332" y="106" width="100" height="20" rx="10" fill="#FFFFFF" stroke="#106B3D" stroke-width="1"/>
  <text x="382" y="120" font-size="11" font-weight="700" fill="#106B3D" text-anchor="middle">最难 · 最有价值</text>
  <text x="202" y="126" font-size="14" font-weight="700" fill="#FFFFFF">第三层 · 主动服务</text>
  <text x="202" y="152" font-size="12.5" fill="#E6F7EE">在合适时机主动用记忆</text>
  <text x="202" y="176" font-size="12.5" fill="#E6F7EE">例：周五早上主动提醒有班会</text>

  <rect x="108" y="206" width="332" height="110" rx="10" fill="#9FDDBB" stroke="#7FD3A8" stroke-width="1.4"/>
  <text x="126" y="236" font-size="14" font-weight="700" fill="#106B3D">第二层 · 推理与应用</text>
  <text x="126" y="262" font-size="12.5" fill="#157A46">能结合多条记忆做判断</text>
  <text x="126" y="288" font-size="12.5" fill="#157A46">例：周五下午能否开班会，要同时用课表和班会时间</text>

  <rect x="32" y="316" width="408" height="110" rx="10" fill="#E6F7EE" stroke="#A8E5C6" stroke-width="1.4"/>
  <text x="50" y="346" font-size="14" font-weight="700" fill="#106B3D">第一层 · 基础回忆</text>
  <text x="50" y="372" font-size="12.5" fill="#157A46">存进去、能取对就行</text>
  <rect x="50" y="386" width="120" height="22" rx="11" fill="#FFFFFF" stroke="#A8E5C6" stroke-width="1"/>
  <text x="110" y="401" font-size="11.5" font-weight="700" fill="#106B3D" text-anchor="middle">关键：分块、召回</text>

  <text x="230" y="458" font-size="11.5" fill="#5D6B7C" text-anchor="middle">记忆三层次评估：每层约 20 个用例、每例约 50 轮，逐层验收</text>
</svg>
