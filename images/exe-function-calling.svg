<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" width="460" height="500" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <rect x="0" y="0" width="460" height="500" rx="14" fill="#FFFFFF" stroke="#B9D9FF" stroke-width="1.4"/>

  <!-- ============ 顶部：谁决策、谁执行 ============ -->
  <text x="18" y="38" font-size="12.5" font-weight="700" fill="#5D6B7C">决策方是<tspan fill="#14629E">模型</tspan>，执行方是<tspan fill="#E23C41">程序</tspan></text>
  <text x="18" y="56" font-size="11.5" fill="#5D6B7C">模型只负责“说要做什么”，真正动手的是程序</text>

  <!-- ============ 第 1 步：用户提问（蓝） ============ -->
  <rect x="18" y="66" width="424" height="66" rx="12" fill="#F7FAFF" stroke="#B9D9FF" stroke-width="1.3"/>
  <circle cx="46" cy="97" r="13" fill="#1F7AE0"/>
  <text x="46" y="102" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="68" y="92" font-size="15" font-weight="700" fill="#14629E">用户提问</text>
  <rect x="68" y="100" width="152" height="26" rx="13" fill="#EDF5FF" stroke="#B9D9FF" stroke-width="1.2"/>
  <text x="144" y="117" font-size="12.5" fill="#14629E" text-anchor="middle">明天会下雨吗？</text>

  <!-- 箭头 1 -->
  <path d="M230,133 L230,139" fill="none" stroke="#B9D9FF" stroke-width="1.6"/>
  <path d="M230,145 L226,137.5 L234,137.5 Z" fill="#B9D9FF"/>

  <!-- ============ 第 2 步：模型输出 JSON 指令（橙，重点） ============ -->
  <rect x="18" y="146" width="424" height="138" rx="12" fill="#FFF9F2" stroke="#FFDCA8" stroke-width="1.4"/>
  <circle cx="46" cy="177" r="13" fill="#FF9F2E"/>
  <text x="46" y="182" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="68" y="172" font-size="15" font-weight="700" fill="#98550A">模型输出 JSON 指令</text>
  <text x="68" y="194" font-size="12.5" fill="#5D6B7C">模型不直接回答，而是输出一段结构化指令</text>
  <rect x="68" y="204" width="344" height="54" rx="9" fill="#EEF3F9" stroke="#C9D8E8" stroke-width="1.2"/>
  <text x="82" y="225" font-size="11.5" fill="#14629E" font-family="Consolas,Menlo,monospace">{"tool":"weather_query",</text>
  <text x="82" y="245" font-size="11.5" fill="#14629E" font-family="Consolas,Menlo,monospace">"args":{"city":"北京","when":"明天"}}</text>
  <text x="68" y="274" font-size="11.5" fill="#5D6B7C">模型输出的是结构化指令，不是自然语言——这样程序才读得懂</text>

  <!-- 箭头 2 -->
  <path d="M230,285 L230,291" fill="none" stroke="#B9D9FF" stroke-width="1.6"/>
  <path d="M230,297 L226,289.5 L234,289.5 Z" fill="#B9D9FF"/>

  <!-- ============ 第 3 步：程序执行工具（绿） ============ -->
  <rect x="18" y="298" width="424" height="64" rx="12" fill="#F5FBF7" stroke="#B8E0C6" stroke-width="1.3"/>
  <circle cx="46" cy="329" r="13" fill="#1F7A45"/>
  <text x="46" y="334" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="68" y="324" font-size="15" font-weight="700" fill="#1F7A45">程序执行工具</text>
  <text x="68" y="345" font-size="12.5" fill="#5D6B7C">程序读到这段 JSON，就去调用真实的天气接口</text>

  <!-- 箭头 3 -->
  <path d="M230,363 L230,369" fill="none" stroke="#B9D9FF" stroke-width="1.6"/>
  <path d="M230,375 L226,367.5 L234,367.5 Z" fill="#B9D9FF"/>

  <!-- ============ 第 4 步：结果回填模型（蓝） ============ -->
  <rect x="18" y="376" width="424" height="64" rx="12" fill="#F7FAFF" stroke="#B9D9FF" stroke-width="1.3"/>
  <circle cx="46" cy="407" r="13" fill="#1F7AE0"/>
  <text x="46" y="412" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="68" y="402" font-size="15" font-weight="700" fill="#14629E">结果回填模型</text>
  <text x="68" y="423" font-size="12.5" fill="#5D6B7C">把工具返回的真实数据塞回模型，模型再生成人话回答</text>

  <!-- ============ 底部结论 ============ -->
  <rect x="18" y="452" width="424" height="36" rx="12" fill="#E8F5EC" stroke="#B8E0C6" stroke-width="1.3"/>
  <text x="230" y="475" font-size="12.5" font-weight="700" fill="#1F7A45" text-anchor="middle">好处：比“用提示词求模型拼 JSON”鲁棒得多</text>
</svg>
